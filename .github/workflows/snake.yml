name: Generate Datas

on:
  schedule: # اجرای خودکار هر ۱۲ ساعت
    - cron: "0 */12 * * *"
  workflow_dispatch: # اجرای دستی
  push:
    branches:
    - main

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # تولید انیمیشن مار
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F4C95D&color_dots=#111111,#222222,#444444,#A68532,#F4C95D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # پوش کردن تصویر تولید شده به یک برنچ جدید به اسم output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
